<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bramy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0d0d0d;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 32px;
            padding: 30px;
            -webkit-tap-highlight-color: transparent;
        }

        h1 {
            font-size: 26px;
            font-weight: 500;
            opacity: 0.6;
            letter-spacing: 1px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 24px;
            width: 100%;
            max-width: 520px;
        }

        a.button {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 150px;
            background: #1c1c1e;
            border-radius: 28px;
            color: white;
            text-decoration: none;
            font-size: 34px;
            font-weight: 600;
            transition: all 0.15s ease;
            border: 3px solid transparent;
            user-select: none;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        a.button:active {
            transform: scale(0.96);
        }

        .brama {
            border-color: #30d158;
            background: linear-gradient(145deg, #1a2e1f, #1c1c1e);
        }

        .brama:active {
            background: #1f3d26;
        }

        .garaz {
            border-color: #0a84ff;
            background: linear-gradient(145deg, #0f1c2e, #1c1c1e);
        }

        .garaz:active {
            background: #0f2a4a;
        }

        .icon {
            font-size: 48px;
            margin-right: 22px;
        }
    </style>
</head>
<body>
    <h1>Sterowanie bramami</h1>

    <div class="buttons">
        <!-- BRAMA -->
        <a href="https://svr21.supla.org/direct/2055/a5VknYg56kYmw5M/open-close" class="button brama">
            <span class="icon">🚪</span>
            Brama
        </a>

        <!-- GARAŻ -->
        <a href="https://svr21.supla.org/direct/2056/NJjsEfBMYcM9Bw_/open-close" class="button garaz">
            <span class="icon">🏠</span>
            Brama garażowa
        </a>
    </div>
</body>
</html>
