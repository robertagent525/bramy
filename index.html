<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bramy</title>
<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}

body {
background: #111;
color: #fff;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
height: 100vh;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
gap: 40px;
padding: 40px;
-webkit-tap-highlight-color: transparent;
}

h1 {
font-size: 28px;
font-weight: 500;
opacity: 0.7;
margin-bottom: 10px;
}

.buttons {
display: flex;
flex-direction: column;
gap: 30px;
width: 100%;
max-width: 500px;
}

a.button {
display: flex;
align-items: center;
justify-content: center;
height: 140px;
background: #1c1c1e;
border: 2px solid #333;
border-radius: 24px;
color: white;
text-decoration: none;
font-size: 32px;
font-weight: 600;
transition: all 0.15s ease;
user-select: none;
}

a.button:active {
background: #2c2c2e;
transform: scale(0.97);
border-color: #0a84ff;
}

.brama {
border-color: #30d158;
}

.brama:active {
border-color: #30d158;
background: #1a3a22;
}

.garaz {
border-color: #0a84ff;
}

.garaz:active {
border-color: #0a84ff;
background: #0a2848;
}

.icon {
font-size: 42px;
margin-right: 20px;
}
</style>
</head>
<body>
<h1>Sterowanie bramami</h1>

<div class="buttons">
<!-- BRAMA -->
<a href="https://svr21.supla.org/direct/2056/a5VknYg56kYmw5M/open-close"
class="button brama">
<span class="icon">🚪</span>
Brama
</a>

<!-- GARAŻ -->
<a href="https://svr21.supla.org/direct/2056/NJjsEfBMYcM9Bw_/open-close"
class="button garaz">
<span class="icon">🏠</span>
Brama garażowa
</a>
</div>
</body>
</html>
